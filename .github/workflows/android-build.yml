name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: Download Model and Quran Images
      run: node download_assets.js

    - name: Run Expo Prebuild
      run: npx expo prebuild --platform android

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build with Gradle
      working-directory: ./android
      run: ./gradlew assembleRelease -x lint || (cat app/build/reports/errors/* && exit 1)

    - name: Sign APK
      run: |
        keytool -genkey -v -keystore release.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Test"
        # Find apksigner
        APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
        # Find the generated APK (could be app-release-unsigned.apk or app-release.apk)
        APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
        echo "Signing $APK_PATH with $APKSIGNER"
        $APKSIGNER sign --ks release.keystore --ks-pass pass:password $APK_PATH
        cp $APK_PATH android/app/build/outputs/apk/release/mushaf-release.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: mushaf-qiyam-apk
        path: android/app/build/outputs/apk/release/mushaf-release.apk

    - name: Upload Logs on Failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: gradle-logs
        path: |
          android/app/build/reports/
          android/app/build/outputs/logs/

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "android/app/build/outputs/apk/release/mushaf-release.apk"
        tag: "latest-react-native"
        name: "React Native APK Release"
        body: "Auto-generated Expo/React Native APK."
        allowUpdates: true
        makeLatest: true
