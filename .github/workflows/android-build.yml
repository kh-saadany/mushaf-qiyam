name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - path-b-zipformer
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Fast Verification & Code Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.6'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download Sherpa AAR Binary
      run: |
        mkdir -p app/libs
        curl -L --retry 5 -o app/libs/sherpa-onnx-1.13.4.aar "https://huggingface.co/csukuangfj2/sherpa-onnx-libs/resolve/main/android/aar/sherpa-onnx-1.13.4.aar?download=true"

    - name: Run Kotlin Compilation Verification
      run: ./gradlew compileReleaseKotlin

  build:
    name: Build, Package & Publish Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.6'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download Model Assets for Offline ASR & Mushaf Pages
      run: |
        mkdir -p app/libs
        echo "Downloading Sherpa-ONNX 1.13.4 AAR binary..."
        curl -L --retry 5 -o app/libs/sherpa-onnx-1.13.4.aar "https://huggingface.co/csukuangfj2/sherpa-onnx-libs/resolve/main/android/aar/sherpa-onnx-1.13.4.aar?download=true"
        mkdir -p app/src/main/assets/tilawa_model
        cp -f assets/quran-pages.json app/src/main/assets/quran-pages.json
        cp -f assets/ayah-boxes.json app/src/main/assets/ayah-boxes.json
        COMMIT_MSG=$(git log -1 --pretty=%B)
        HF_AUTH=""
        if [ -n "${{ secrets.HF_TOKEN }}" ]; then
          HF_AUTH="-H \"Authorization: Bearer ${{ secrets.HF_TOKEN }}\""
        fi
        if [[ "$COMMIT_MSG" == *"[full]"* ]]; then
          echo "Full build: Copying 604 Mushaf pages from assets/mushaf - small..."
          mkdir -p app/src/main/assets/mushaf_pages
          cp -f "assets/mushaf - small"/*.png app/src/main/assets/mushaf_pages/
          echo "Full build: Downloading Zipformer2-CTC Quran Phoneme ONNX model (~69MB)..."
          MODEL_URL="https://huggingface.co/Quran-Lab/zipformer_p-arabic-v3/resolve/main/zipformer_p_arabic_v3.int8.onnx"
          TOKENS_URL="https://huggingface.co/Quran-Lab/zipformer_p-arabic-v3/resolve/main/tokens.txt"
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "HF_TOKEN not set, using verified mirror..."
            MODEL_URL="https://huggingface.co/voidwaveDev/phoneme-v3/resolve/main/zipformer_p_arabic_v3.1.int8.onnx"
            TOKENS_URL="https://huggingface.co/voidwaveDev/phoneme-v3/resolve/main/tokens.txt"
          fi
          eval curl $HF_AUTH -L --retry 5 -o app/src/main/assets/tilawa_model/model.int8.onnx "$MODEL_URL"
          eval curl $HF_AUTH -L --retry 5 -o app/src/main/assets/tilawa_model/tokens.txt "$TOKENS_URL"
        else
          echo "Lite build: Skipping heavy ONNX model downloads and Mushaf pages for ultra-compact patch APK."
          TOKENS_URL="https://huggingface.co/Quran-Lab/zipformer_p-arabic-v3/resolve/main/tokens.txt"
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            TOKENS_URL="https://huggingface.co/voidwaveDev/phoneme-v3/resolve/main/tokens.txt"
          fi
          eval curl $HF_AUTH -L --retry 5 -o app/src/main/assets/tilawa_model/tokens.txt "$TOKENS_URL"
        fi

    - name: Decode Keystore
      env:
        ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$ENCODED_STRING" | base64 -d > keystore.jks

    - name: Build Android APK
      run: ./gradlew assembleRelease

    - name: Sign APK & Package Single File
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%B)
        RAW_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)

        if [ -f "keystore.jks" ]; then
          echo "Signing APK with production release keystore..."
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            "$RAW_APK"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$RAW_APK"
        else
          echo "WARNING: Keystore not found! APK may remain signed with debug cert."
        fi

        if [[ "$COMMIT_MSG" == *"[full]"* ]]; then
          echo "Packaging Full Release APK..."
          mv "$RAW_APK" app/build/outputs/apk/release/mushaf-qiyam-b-full.apk
        else
          echo "Packaging Lite Release APK..."
          mv "$RAW_APK" app/build/outputs/apk/release/mushaf-qiyam-b-lite.apk
        fi

    - name: Clean & Hide Previous GitHub Releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        python scripts/cleanup_releases.py

    - name: Create Single Release Asset
      uses: ncipollo/release-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: "app/build/outputs/apk/release/*.apk"
        tag: "v0.7.0.8"
        name: "مصحف القيام (ب) — V0.7.0.8 (Lite Patch - Phonetic Wasl & Discovery Hardening)"
        allowUpdates: true
        recreate: true
        body: |
          ### مصحف القيام (ب) — تحديث برمجي خفيف V0.7.0.8 (Lite Patch)

          يتضمن هذا التحديث حزمة تحسينات صوتية وخوارزمية دقيقة:
          1. **المحاكاة الصوتية لهمزة الوصل (Phonetic Wasl Assimilation):** إسقاط همزة الوصل وصلاً في اللام القمرية والشمسية، وحذف أحرف المد عند التقاء الساكنين، مع الحماية التامة للكلمات الأصلية عبر تمييز علامة همزة الوصل العثمانية.
          2. **حماية قص البسملة (Basmalah Boundary Protection):** قص البسملة في مستهل المسرد الصوتي فقط مع حماية آية سورة النمل (27:30)، ومنع القفل على الآيتين 1:1 و1:3 في وضع الاكتشاف العام.
          3. **دقة مؤشر كلمات الآية:** اعتماد عدد كلمات الآية المباشر لضمان دقة نسبة الإنجاز في كل آية.
          4. **توسيع مرشحي المرحلة الأولى ومكافأة البداية:** رفع عدد مرشحي الاكتشاف إلى 15 مرشحاً مع منح مكافأة لأول 4 أحرف لضمان وصول الآيات الطويلة كسورة الكهف [18:1] لمرحلة المحاذاة.
          5. **حجم التحديث الخفيف:** تعديل برمجي على مستوى الأكواد فقط (~40.9MB).



