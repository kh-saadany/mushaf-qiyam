name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Fast Verification & Code Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.6
        chmod +x gradlew

    - name: Run Kotlin Compilation Verification
      run: ./gradlew compileReleaseKotlin

  build:
    name: Build, Package & Publish Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.6
        chmod +x gradlew

    - name: Download Model Assets for Offline ASR & Mushaf Pages
      run: |
        mkdir -p app/src/main/assets/tilawa_model
        cp -f assets/quran-pages.json app/src/main/assets/quran-pages.json
        cp -f assets/ayah-boxes.json app/src/main/assets/ayah-boxes.json
        COMMIT_MSG=$(git log -1 --pretty=%B)
        if [[ "$COMMIT_MSG" == *"[full]"* ]]; then
          echo "Full build: Copying 604 Mushaf pages from assets/mushaf - small..."
          mkdir -p app/src/main/assets/mushaf_pages
          cp -f "assets/mushaf - small"/*.png app/src/main/assets/mushaf_pages/
          echo "Full build: Downloading FastConformer Quran Streaming Transducer ONNX models (~129MB)..."
          curl -L --retry 5 -o app/src/main/assets/tilawa_model/encoder.int8.onnx "https://huggingface.co/mohammed/fastconformer-quran-ar-onnx-int8/resolve/main/encoder.int8.onnx"
          curl -L --retry 5 -o app/src/main/assets/tilawa_model/decoder.int8.onnx "https://huggingface.co/mohammed/fastconformer-quran-ar-onnx-int8/resolve/main/decoder.int8.onnx"
          curl -L --retry 5 -o app/src/main/assets/tilawa_model/joiner.int8.onnx "https://huggingface.co/mohammed/fastconformer-quran-ar-onnx-int8/resolve/main/joiner.int8.onnx"
          curl -L --retry 5 -o app/src/main/assets/tilawa_model/tokens.txt "https://huggingface.co/mohammed/fastconformer-quran-ar-onnx-int8/resolve/main/tokens.txt"
          echo "Transforming encoder to remove ConvInteger for ARM64 Android compatibility..."
          pip install onnx numpy
          python scripts/fix_encoder_conv.py app/src/main/assets/tilawa_model/encoder.int8.onnx app/src/main/assets/tilawa_model/encoder.onnx
          rm -f app/src/main/assets/tilawa_model/encoder.int8.onnx
        else
          echo "Lite build: Skipping heavy ONNX model downloads and Mushaf pages for ultra-compact patch APK."
          curl -L --retry 5 -o app/src/main/assets/tilawa_model/tokens.txt "https://huggingface.co/mohammed/fastconformer-quran-ar-onnx-int8/resolve/main/tokens.txt"
        fi

    - name: Decode Keystore
      env:
        ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$ENCODED_STRING" | base64 -d > keystore.jks

    - name: Build Android APK
      run: ./gradlew assembleRelease

    - name: Sign APK & Package Single File
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%B)
        RAW_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)

        if [ -f "keystore.jks" ]; then
          echo "Signing APK with production release keystore..."
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            "$RAW_APK"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$RAW_APK"
        else
          echo "WARNING: Keystore not found! APK may remain signed with debug cert."
        fi

        if [[ "$COMMIT_MSG" == *"[full]"* ]]; then
          echo "Packaging Full Release APK..."
          mv "$RAW_APK" app/build/outputs/apk/release/mushaf-qiyam-full.apk
        else
          echo "Packaging Lite Release APK..."
          mv "$RAW_APK" app/build/outputs/apk/release/mushaf-qiyam-lite.apk
        fi

    - name: Create Single Release Asset
      uses: ncipollo/release-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: "app/build/outputs/apk/release/*.apk"
        tag: "v5.7.0"
        name: "مصحف القيام — V5.7.0 (Full - Interactive Visual Mushaf Viewer & Ayah Highlighting)"
        allowUpdates: true
        recreate: true
        body: |
          ### مصحف القيام — V5.7.0 (النسخة الكاملة — عارض المصحف البصري وتظليل الآيات التفاعلي)
          تتضمن هذه النسخة الكاملة (المرحلة 1):
          - شحن وحفظ جميع صفحات المصحف الشريف (604 صفحات مضغوطة عالية الوضوح) في الذاكرة الداخلية للجهاز لتعتمد عليها كافة النسخ الخفيفة القادمة.
          - عارض المصحف التفاعلي بالوضع العمودي مع التقليب بالسحب (RTL Swipe) والانتقال السريع لأي سورة أو صفحة.
          - تظليل بصري شفاف (Canvas Overlay) لحدود الآية النشطة بدقة الكلمة وعلامة الآية، مع دعم الضغط المباشر على أي آية لتظليلها.


