name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - path-b-zipformer
      - v0.8.0-dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Fast Verification & Code Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download Sherpa AAR Binary
      run: |
        mkdir -p app/libs
        curl -L --retry 5 -o app/libs/sherpa-onnx-1.13.4.aar "https://huggingface.co/csukuangfj2/sherpa-onnx-libs/resolve/main/android/aar/sherpa-onnx-1.13.4.aar?download=true"

    - name: Run Kotlin Compilation Verification
      run: |
        set -o pipefail
        ./gradlew compileReleaseKotlin 2>&1 | tee compilation_log.txt

    - name: Post Compilation Errors to Commit Comment
      if: failure()
      run: python3 scripts/post_failure_comment.py
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build, Package & Publish Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download Model Assets for Offline ASR & Mushaf Pages
      run: |
        mkdir -p app/libs
        echo "Downloading Sherpa-ONNX 1.13.4 AAR binary..."
        curl -L --retry 5 -o app/libs/sherpa-onnx-1.13.4.aar "https://huggingface.co/csukuangfj2/sherpa-onnx-libs/resolve/main/android/aar/sherpa-onnx-1.13.4.aar?download=true"
        mkdir -p app/src/main/assets/tilawa_model
        cp -f assets/quran-pages.json app/src/main/assets/quran-pages.json
        cp -f assets/ayah-boxes.json app/src/main/assets/ayah-boxes.json
        COMMIT_MSG=$(git log -1 --pretty=%B)
        HF_AUTH=""
        if [ -n "${{ secrets.HF_TOKEN }}" ]; then
          HF_AUTH="-H \"Authorization: Bearer ${{ secrets.HF_TOKEN }}\""
        fi
        if [[ "$COMMIT_MSG" == *"[full]"* ]]; then
          echo "Full build: Copying 604 Mushaf pages from assets/mushaf - small..."
          mkdir -p app/src/main/assets/mushaf_pages
          cp -f "assets/mushaf - small"/*.png app/src/main/assets/mushaf_pages/
          echo "Full build: Downloading Zipformer2-CTC Quran Phoneme ONNX model (~69MB)..."
          MODEL_URL="https://huggingface.co/Quran-Lab/zipformer_p-arabic-v3/resolve/main/zipformer_p_arabic_v3.int8.onnx"
          TOKENS_URL="https://huggingface.co/Quran-Lab/zipformer_p-arabic-v3/resolve/main/tokens.txt"
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "HF_TOKEN not set, using verified mirror..."
            MODEL_URL="https://huggingface.co/voidwaveDev/phoneme-v3/resolve/main/zipformer_p_arabic_v3.1.int8.onnx"
            TOKENS_URL="https://huggingface.co/voidwaveDev/phoneme-v3/resolve/main/tokens.txt"
          fi
          eval curl $HF_AUTH -L --retry 5 -o app/src/main/assets/tilawa_model/model.int8.onnx "$MODEL_URL"
          eval curl $HF_AUTH -L --retry 5 -o app/src/main/assets/tilawa_model/tokens.txt "$TOKENS_URL"
        else
          echo "Lite build: Skipping heavy ONNX model downloads and Mushaf pages for ultra-compact patch APK."
          TOKENS_URL="https://huggingface.co/Quran-Lab/zipformer_p-arabic-v3/resolve/main/tokens.txt"
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            TOKENS_URL="https://huggingface.co/voidwaveDev/phoneme-v3/resolve/main/tokens.txt"
          fi
          eval curl $HF_AUTH -L --retry 5 -o app/src/main/assets/tilawa_model/tokens.txt "$TOKENS_URL"
        fi

    - name: Decode Keystore
      env:
        ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$ENCODED_STRING" | base64 -d > keystore.jks

    - name: Build Android APK
      run: ./gradlew assembleRelease

    - name: Sign APK & Package Single File
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%B)
        RAW_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)

        echo "Ensuring 16KB page alignment with zipalign..."
        $ANDROID_HOME/build-tools/34.0.0/zipalign -p -f 16 "$RAW_APK" "${RAW_APK}.aligned"
        mv "${RAW_APK}.aligned" "$RAW_APK"

        if [ -f "keystore.jks" ]; then
          echo "Signing APK with production release keystore (v1, v2, v3)..."
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$RAW_APK"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs "$RAW_APK"
        else
          echo "WARNING: Keystore not found! APK may remain signed with debug cert."
        fi

        VERSION=$(grep 'versionName =' app/build.gradle.kts | sed 's/.*versionName = "\(.*\)".*/\1/')
        echo "Extracted App Version: $VERSION"

        if [[ "$COMMIT_MSG" == *"[full]"* ]]; then
          echo "Packaging Full Release APK..."
          mv "$RAW_APK" "app/build/outputs/apk/release/mushaf-qiyam-v${VERSION}-full.apk"
        else
          echo "Packaging Lite Release APK..."
          mv "$RAW_APK" "app/build/outputs/apk/release/mushaf-qiyam-v${VERSION}-lite.apk"
        fi

    - name: Clean & Hide Previous GitHub Releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        python scripts/cleanup_releases.py

    - name: Create Single Release Asset
      uses: ncipollo/release-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: "app/build/outputs/apk/release/*.apk"
        tag: "v0.7.5.5"
        name: "مصحف القيام — V0.7.5.5 (Audio JNI Hardening & Crash Diagnostics Hotfix)"
        allowUpdates: true
        recreate: true
        body: |
          ### مصحف القيام — تحديث V0.7.5.5 [lite]

          1. **إصلاح أمان الذاكرة وتراكم عينات الصوت (Silence Kaldi Fbank Drain):** إيقاف تمرير عينات الصوت إلى `acceptWaveform` فور استمرار الصمت أكثر من ثانيتين وتصفير المسار لمنع انفجار ذاكرة Fbank عند استيقاظ خيط الاستدلال مع أول كلمة.
          2. **حماية مسار الاستدعاء الأصلي وقفل الخيوط (`streamLock` Discipline):** قراءة `currentStream` و`recognizer` حصرياً داخل قفل التزامن لمنع أي تداخل أو وصول لذاكرة محررة (Use-After-Free) في مكتبات C++.
          3. **التقاط أخطاء الذاكرة الأصلية (Native Exit Diagnostics):** الاستعلام عن أسباب خروج العملية عبر `ApplicationExitInfo` على Android 11+ لالتقاط إشارات `SIGSEGV` و`SIGABRT` وحالات الذاكرة المنخفضة وعرضها في نافذة تقرير قابلة للنسخ.
          4. **الدرع البرمجي العام وحفظ السجل (`CrashHandler`):** التقاط كافة الاستثناءات غير المعالجة وتغليف استدعاءات `Looper` و`handlePartialResult` بكتل حماية وحفظ الـ Stack Trace على القرص مع زر نسخ بلمسة واحدة.
          5. **منع ضغط أصول النماذج (AAPT2 No-Compress):** حظر ضغط ملفات `onnx` و`txt` في الـ APK لضمان قراءة الذاكرة المتوافقة مع أجهزة سامسونج وAndroid 14+.



