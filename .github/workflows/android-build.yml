name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check Build Type
      id: check
      run: |
        MSG="${{ github.event.head_commit.message }}"
        if [[ "$MSG" == *"[lite]"* ]]; then
          echo "build_lite=true" >> $GITHUB_OUTPUT
          echo "build_full=false" >> $GITHUB_OUTPUT
        elif [[ "$MSG" == *"[full]"* ]]; then
          echo "build_lite=false" >> $GITHUB_OUTPUT
          echo "build_full=true" >> $GITHUB_OUTPUT
        else
          echo "build_lite=true" >> $GITHUB_OUTPUT
          echo "build_full=true" >> $GITHUB_OUTPUT
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: Download Model and Quran Images
      if: steps.check.outputs.build_full == 'true'
      run: node download_assets.js

    - name: Run Expo Prebuild
      run: npx expo prebuild --platform android

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build Lite APK
      if: steps.check.outputs.build_lite == 'true'
      working-directory: ./android
      run: |
        ./gradlew assembleRelease -x lint || (cat app/build/reports/errors/* && exit 1)
        cp app/build/outputs/apk/release/app-release.apk ../mushaf-lite-unsigned.apk
        ./gradlew clean

    - name: Copy Assets to Android Raw Assets
      if: steps.check.outputs.build_full == 'true'
      run: |
        mkdir -p android/app/src/main/assets/mushaf
        cp assets/ggml-model.bin android/app/src/main/assets/ggml-model.bin
        cp assets/ggml-silero-v6.2.0.bin android/app/src/main/assets/ggml-silero-v6.2.0.bin
        cp assets/mushaf/* android/app/src/main/assets/mushaf/

    - name: Build Full APK
      if: steps.check.outputs.build_full == 'true'
      working-directory: ./android
      run: |
        ./gradlew assembleRelease -x lint || (cat app/build/reports/errors/* && exit 1)
        cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/mushaf-full-unsigned.apk

    - name: Sign Both APKs
      run: |
        keytool -genkey -v -keystore release.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Test"
        APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
        
        # Create output directory in case gradlew clean deleted it
        mkdir -p android/app/build/outputs/apk/release
        
        # Sign Lite APK
        if [ -f mushaf-lite-unsigned.apk ]; then
          $APKSIGNER sign --ks release.keystore --ks-pass pass:password mushaf-lite-unsigned.apk
          mv mushaf-lite-unsigned.apk android/app/build/outputs/apk/release/mushaf-lite.apk
        fi
        
        # Sign Full APK
        if [ -f android/app/build/outputs/apk/release/mushaf-full-unsigned.apk ]; then
          $APKSIGNER sign --ks release.keystore --ks-pass pass:password android/app/build/outputs/apk/release/mushaf-full-unsigned.apk
          mv android/app/build/outputs/apk/release/mushaf-full-unsigned.apk android/app/build/outputs/apk/release/mushaf-full.apk
        fi

    - name: Upload Logs on Failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: gradle-logs
        path: |
          android/app/build/reports/
          android/app/build/outputs/logs/

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "android/app/build/outputs/apk/release/mushaf-full.apk,android/app/build/outputs/apk/release/mushaf-lite.apk"
        tag: "latest-react-native"
        name: "React Native APK Release"
        body: |
          ### Mushaf Qiyam Dual-APK Release
          
          * **mushaf-full.apk (~300MB):** Install this for the **first time**. It bundles the voice model and Quran images, copying them to local storage.
          * **mushaf-lite.apk (~10MB):** Install this for **subsequent updates**. It updates the app logic and code while using the model and images already stored on your device.
        allowUpdates: true
        makeLatest: true
        allowMissingFiles: true
