name: Build Native Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.6

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download Sherpa-ONNX AAR & Tilawa Model Assets
      run: |
        mkdir -p app/libs app/src/main/assets/tilawa_model
        curl -L -o app/libs/sherpa-onnx-1.12.40.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.40/sherpa-onnx-1.12.40.aar
        curl -L -o app/src/main/assets/tilawa_model/model.onnx https://github.com/yazinsai/tilawa/releases/download/v0.2.0/fastconformer_full_mixed.onnx
        curl -L -o app/src/main/assets/tilawa_model/vocab.json https://github.com/yazinsai/tilawa/releases/download/v0.2.0/vocab.json
        curl -L -o app/src/main/assets/tilawa_model/quran.json https://github.com/yazinsai/tilawa/releases/download/v0.2.0/quran.json
        curl -L -o app/src/main/assets/tilawa_model/export_metadata.json https://github.com/yazinsai/tilawa/releases/download/v0.2.0/export_metadata.json

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Sign Release APK
      env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
        if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
          $APKSIGNER sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/mushaf-qiyam-release.apk
        fi

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "app/build/outputs/apk/release/mushaf-qiyam-release.apk"
        tag: "latest-native-android"
        name: "مصحف القيام — Native Android"
        body: |
          ### مصحف القيام (V4.0.0 - sherpa-onnx)
          النسخة المحلية بالكامل — Kotlin + Jetpack Compose + sherpa-onnx (Offline ASR).
        allowUpdates: true
        makeLatest: true
        allowMissingFiles: true
