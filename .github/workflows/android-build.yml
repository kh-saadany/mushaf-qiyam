name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.6
        chmod +x gradlew

    - name: Download Model Assets for Offline ASR
      run: |
        mkdir -p app/src/main/assets/tilawa_model
        curl -L --retry 5 -o app/src/main/assets/tilawa_model/vocab.json https://github.com/yazinsai/tilawa/releases/download/v0.2.0/vocab.json
        curl -L --retry 5 -o app/src/main/assets/tilawa_model/model.onnx https://github.com/yazinsai/tilawa/releases/download/v0.2.0/fastconformer_full_mixed.onnx

    - name: Decode Keystore
      env:
        ENCODED_STRING: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$ENCODED_STRING" ]; then
          echo $ENCODED_STRING | base64 -d > app/keystore.jks
        fi

    - name: Build Android APK
      run: ./gradlew assembleRelease

    - name: Sign APK & Package Single File
      env:
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        sudo apt-get update && sudo apt-get install -y zip
        COMMIT_MSG=$(git log -1 --pretty=%B)
        if [[ "$COMMIT_MSG" == *"[full]"* ]]; then
          echo "Full build: Retaining embedded 88MB ONNX model..."
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/mushaf-qiyam-full.apk
        else
          echo "Lite build: Stripping 88MB ONNX model from APK zip..."
          zip -d app/build/outputs/apk/release/app-release-unsigned.apk assets/tilawa_model/model.onnx || true
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/mushaf-qiyam-lite.apk
        fi

        TARGET_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
        if [ -f "app/keystore.jks" ]; then
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks app/keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            "$TARGET_APK"
        fi

    - name: Create Single Release Asset
      uses: ncipollo/release-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: "app/build/outputs/apk/release/*.apk"
        tag: "v4.5.0"
        name: "مصحف القيام — V4.5.0 Lite"
        allowUpdates: true
        recreate: true
        body: |
          ### مصحف القيام — V4.5.0 Lite (تحديث خفيف)
          تحديث خفيف يتضمن كود جديد، واجهة مصححة، وسجل تشخيص فني داخلي.
