name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Fast Verification & Code Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.6
        chmod +x gradlew

    - name: Download Sherpa AAR Binary
      run: |
        mkdir -p app/libs
        curl -L --retry 5 -o app/libs/sherpa-onnx-1.13.4.aar "https://huggingface.co/csukuangfj2/sherpa-onnx-libs/resolve/main/android/aar/sherpa-onnx-1.13.4.aar?download=true"

    - name: Run Kotlin Compilation Verification
      run: ./gradlew compileReleaseKotlin

  build:
    name: Build, Package & Publish Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.6
        chmod +x gradlew

    - name: Download Model Assets for Offline ASR
      run: |
        mkdir -p app/libs
        echo "Downloading Sherpa-ONNX 1.13.4 AAR binary..."
        curl -L --retry 5 -o app/libs/sherpa-onnx-1.13.4.aar "https://huggingface.co/csukuangfj2/sherpa-onnx-libs/resolve/main/android/aar/sherpa-onnx-1.13.4.aar?download=true"
        mkdir -p app/src/main/assets/tilawa_model
        curl -L --retry 5 -o app/src/main/assets/tilawa_model/tokens.txt https://github.com/kh-saadany/mushaf-qiyam/releases/download/sherpa-model-v1.0/tokens.txt
        COMMIT_MSG=$(git log -1 --pretty=%B)
        if [[ "$COMMIT_MSG" == *"[full]"* ]]; then
          echo "Downloading 125MB INT8 FastConformer Sherpa model for Full build..."
          curl -L --retry 5 -o app/src/main/assets/tilawa_model/model.int8.onnx https://github.com/kh-saadany/mushaf-qiyam/releases/download/sherpa-model-v1.0/model.int8.onnx
        else
          echo "Lite build: Skipping model.int8.onnx download for clean, compact APK build."
        fi

    - name: Decode Keystore
      env:
        ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$ENCODED_STRING" | base64 -d > keystore.jks

    - name: Build Android APK
      run: ./gradlew assembleRelease

    - name: Sign APK & Package Single File
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%B)
        RAW_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)

        if [ -f "keystore.jks" ]; then
          echo "Signing APK with production release keystore..."
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            "$RAW_APK"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$RAW_APK"
        else
          echo "WARNING: Keystore not found! APK may remain signed with debug cert."
        fi

        if [[ "$COMMIT_MSG" == *"[full]"* ]]; then
          echo "Packaging Full Release APK..."
          mv "$RAW_APK" app/build/outputs/apk/release/mushaf-qiyam-full.apk
        else
          echo "Packaging Lite Release APK..."
          mv "$RAW_APK" app/build/outputs/apk/release/mushaf-qiyam-lite.apk
        fi

    - name: Create Single Release Asset
      uses: ncipollo/release-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: "app/build/outputs/apk/release/*.apk"
        tag: "v5.3.0"
        name: "مصحف القيام — V5.3.0"
        allowUpdates: true
        recreate: true
        body: |
          ### مصحف القيام — V5.3.0 (دمج محرك Whisper Tiny Quran + التبديل الحي عبر Feature Flag)
          تحديث رئيسي يدمج محرك Whisper-tiny-ar-quran عبر OfflineWhisperModelConfig الخالي من الحالة (Stateless)، مع إضافة خيار التبديل التلقائي والحي بين FastConformer CTC و Whisper في الإعدادات للمقارنة الميدانية.

