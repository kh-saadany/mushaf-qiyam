name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Fast Verification & Code Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.6
        chmod +x gradlew

    - name: Run Kotlin Compilation Verification
      run: ./gradlew compileReleaseKotlin

  build:
    name: Build, Package & Publish Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.6
        chmod +x gradlew

    - name: Download Model Assets for Offline ASR
      run: |
        mkdir -p app/src/main/assets/tilawa_model
        curl -L --retry 5 -o app/src/main/assets/tilawa_model/vocab.json https://github.com/yazinsai/tilawa/releases/download/v0.2.0/vocab.json
        COMMIT_MSG=$(git log -1 --pretty=%B)
        if [[ "$COMMIT_MSG" == *"[full]"* ]]; then
          echo "Downloading 88MB ONNX model for Full build..."
          curl -L --retry 5 -o app/src/main/assets/tilawa_model/model.onnx https://github.com/yazinsai/tilawa/releases/download/v0.2.0/fastconformer_full_mixed.onnx
        else
          echo "Lite build: Skipping ONNX model download for clean, compact APK build."
        fi

    - name: Decode Keystore
      env:
        ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$ENCODED_STRING" ]; then
          echo $ENCODED_STRING | base64 -d > app/keystore.jks
        fi

    - name: Build Android APK
      run: ./gradlew assembleRelease

    - name: Sign APK & Package Single File
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%B)
        if [[ "$COMMIT_MSG" == *"[full]"* ]]; then
          echo "Packaging Full Release APK..."
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/mushaf-qiyam-full.apk
        else
          echo "Packaging Lite Release APK..."
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/mushaf-qiyam-lite.apk
        fi

        TARGET_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
        if [ -f "app/keystore.jks" ]; then
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks app/keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            "$TARGET_APK"
        fi

    - name: Create Single Release Asset
      uses: ncipollo/release-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: "app/build/outputs/apk/release/*.apk"
        tag: "v4.6.0"
        name: "مصحف القيام — V4.6.0 (إصدار شامل)"
        allowUpdates: true
        recreate: true
        body: |
          ### مصحف القيام — V4.6.0 (إصدار شامل جديد)
          إصدار جديد شامل يحتوي على النموذج كاملاً والكود الحديث وسجل التشخيص الفني الداخلي ليعتمد عليه في كافة التحديثات الخفيفة التالية.

