name: Build Native Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Setup Android NDK for CMake / C++ Compilation
    - name: Setup Android NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

    # We manually create the gradlew wrapper if not present, because we created the harness without Android Studio
    - name: Setup Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.6

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Sign Release APK
      env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
        if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
          $APKSIGNER sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/mushaf-native-release.apk
        fi

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "app/build/outputs/apk/release/mushaf-native-release.apk,app/build/outputs/apk/debug/app-debug.apk"
        tag: "latest-native-android"
        name: "Native Android APK Release"
        body: |
          ### Mushaf Qiyam (Native Android V2)
          This is the new natively compiled version of Mushaf Qiyam utilizing Kotlin, Jetpack Compose, and C++ (whisper.cpp).
        allowUpdates: true
        makeLatest: true
        allowMissingFiles: true
